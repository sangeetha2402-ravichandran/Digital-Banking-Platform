
services:
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: banking-kafka-ui

    network_mode: host

    environment:
      KAFKA_CLUSTERS_0_NAME: digital-banking
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: localhost:9092
      DYNAMIC_CONFIG_ENABLED: "true"
      SERVER_PORT: 8090
